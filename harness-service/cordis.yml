- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com'
    models:
      - id: deepseek-v4-flash
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
      - id: deepseek-v4-pro
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
      - id: deepseek-chat
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
      - id: deepseek-reasoner
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: true
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? '/data/sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 4096
